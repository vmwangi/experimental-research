name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run logic and content tests
        run: node tests/run-node.js
      - name: Check that all JS parses
        run: |
          node --check assets/logic.js
          node --check assets/data.js
          node --check assets/app.js
          node --check tests/cases.js
